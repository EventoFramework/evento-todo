plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.eventoframework.demo.todo'
version = '3.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Evento 3.0: the starter builds, starts and stops the bundle from evento.bundle.* properties,
    // with the consumer state in the application's Postgres (tables created on first start).
    implementation 'com.eventoframework:evento-spring-boot-starter:3.0.0'
    implementation 'com.eventoframework:evento-bundle:3.0.0'
    implementation 'com.eventoframework.evento-consumer-state-store:evento-consumer-state-store-jdbc:3.0.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Given/when/then fixtures for aggregates, sagas and services (no server, no database)
    testImplementation 'com.eventoframework:evento-test:3.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
