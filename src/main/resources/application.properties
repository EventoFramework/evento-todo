# Web
server.port=${PORT:8080}
# Behind the demo's reverse proxy: redirects keep https and the public host
server.forward-headers-strategy=framework

# Postgres read-model store (separate database from evento-server's own)
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Evento 3.0: evento-spring-boot-starter builds and runs the bundle from these properties.
# Consumer state (projector/saga/observer checkpoints) goes to the same Postgres: the starter picks
# the JDBC store because it is on the classpath and there is a DataSource; its tables are created
# on first start.
evento.bundle.id=todo-bundle
evento.bundle.version=3
evento.bundle.description=Collaborative todo lists, the Evento live demo
evento.bundle.servers=${EVENTO_SERVER_HOST:localhost}:${EVENTO_SERVER_PORT:3030}
# A hardened server (security profile prod) wants a shared bus token, TLS and known payload classes
evento.bundle.auth-token=${EVENTO_BUNDLE_AUTH_TOKEN:}
evento.bundle.tls.enabled=${EVENTO_BUNDLE_TLS_ENABLED:false}
evento.bundle.tls.trust-certs=${EVENTO_BUNDLE_TLS_TRUST_CERTS:}
evento.bundle.serialization.restrict=true

# Demo niceties
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
logging.level.com.evento=INFO
